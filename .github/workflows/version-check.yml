name: Version consistency

on:
  pull_request:
    paths:
      - "schema/promptpack.schema.json"
      - "README.md"
      - "scripts/check-version-consistency.mjs"
      - "scripts/check-schema-patterns.mjs"
      - ".github/workflows/version-check.yml"
  push:
    branches: [main]

jobs:
  check:
    name: Schema / README version drift
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: "20"
      - name: Run consistency check
        run: node scripts/check-version-consistency.mjs
      - name: Check schema patterns compile under RE2 (Go)
        run: node scripts/check-schema-patterns.mjs
