name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
    # Review gh actions docs if you want to further define triggers, paths, etc
    # https://docs.github.com/en/actions/using-workflows/workflow-syntax-for-github-actions#on

permissions:
  contents: read
  # The site now installs @altairalabs/brand and atlas-tokens from GitHub
  # Packages; without this the default token gets a 401 on download.
  packages: read
  pages: write
  id-token: write

# Allow only one concurrent deployment, skipping runs queued between the run in-progress and latest queued.
# However, do NOT cancel in-progress runs as we want to allow these production deployments to complete.
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        
      - name: Configure Git Credentials
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          
      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          # Astro 7 requires >=22.12. Docusaurus ran fine on 20; this is part of
          # the migration, not an incidental bump.
          node-version: 22
          cache: npm
          cache-dependency-path: ./promptpack-docs/package-lock.json
          
      - name: Install dependencies
        run: |
          cd promptpack-docs
          npm ci
        env:
          # @altairalabs/brand and atlas-tokens come from GitHub Packages, which
          # the Docusaurus site never needed — every dependency was public.
          #
          # The org-level NODE_AUTH_TOKEN, not the default GITHUB_TOKEN: the
          # packages are `access: restricted`, and a workflow token only reaches
          # packages its own repository owns. It gets a 403
          # "permission_denied: read_package" here. Every sibling site that
          # consumes @altairalabs/* uses this same secret.
          NODE_AUTH_TOKEN: ${{ secrets.NODE_AUTH_TOKEN }}
      
      - name: Sync RFCs to docs
        run: |
          cd promptpack-docs
          node scripts/sync-rfcs.js
          
      - name: Build website
        run: |
          cd promptpack-docs
          npm run build
          
      - name: Setup Pages
        uses: actions/configure-pages@v6

      - name: Upload to GitHub Pages
        uses: actions/upload-pages-artifact@v5
        with:
          path: ./promptpack-docs/build

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5