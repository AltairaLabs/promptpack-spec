<svg width="200" height="200" viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg" fill="none">
  <defs>
    <linearGradient id="evalGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8B5CF6"/>
      <stop offset="100%" stop-color="#5B21B6"/>
    </linearGradient>
  </defs>

  <!-- Eval report card -->
  <rect x="28" y="36" width="144" height="128" rx="12" fill="white" stroke="#7045AF" stroke-width="2.5"/>

  <!-- Header bar -->
  <rect x="44" y="52" width="56" height="6" rx="3" fill="#7045AF"/>
  <rect x="44" y="64" width="36" height="4" rx="2" fill="#7045AF" opacity="0.45"/>

  <!-- Pass badge top-right -->
  <circle cx="150" cy="58" r="10" fill="#10B981"/>
  <path d="M 144 58 L 148 62 L 156 54" stroke="white" stroke-width="2.2" fill="none" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Eval result bars (3 metrics) -->
  <!-- bar 1: tone-check, high -->
  <rect x="44" y="88" width="112" height="6" rx="3" fill="#7045AF" opacity="0.18"/>
  <rect x="44" y="88" width="104" height="6" rx="3" fill="url(#evalGrad)"/>

  <!-- bar 2: json-valid, medium-high -->
  <rect x="44" y="104" width="112" height="6" rx="3" fill="#7045AF" opacity="0.18"/>
  <rect x="44" y="104" width="84" height="6" rx="3" fill="url(#evalGrad)"/>

  <!-- bar 3: coverage, near full -->
  <rect x="44" y="120" width="112" height="6" rx="3" fill="#7045AF" opacity="0.18"/>
  <rect x="44" y="120" width="112" height="6" rx="3" fill="url(#evalGrad)"/>

  <!-- Footer: pack version line -->
  <rect x="44" y="142" width="44" height="4" rx="2" fill="#7045AF" opacity="0.45"/>
  <rect x="96" y="142" width="28" height="4" rx="2" fill="#7045AF" opacity="0.45"/>
</svg>
