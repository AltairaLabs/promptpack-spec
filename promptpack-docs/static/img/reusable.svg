<svg width="200" height="200" viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg" fill="none">
  <defs>
    <linearGradient id="reusableGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8B5CF6"/>
      <stop offset="100%" stop-color="#5B21B6"/>
    </linearGradient>
  </defs>

  <!-- Three stacked pack cards showing reuse / build-once-deploy-many -->
  <rect x="36" y="48" width="116" height="84" rx="10" fill="#A78BFA" opacity="0.35"/>
  <rect x="46" y="58" width="116" height="84" rx="10" fill="#8B5CF6" opacity="0.55"/>
  <rect x="56" y="68" width="116" height="84" rx="10" fill="url(#reusableGrad)"/>

  <!-- Pack contents on top card -->
  <rect x="70" y="84" width="28" height="6" rx="3" fill="white"/>
  <rect x="104" y="84" width="52" height="6" rx="3" fill="white" opacity="0.55"/>
  <rect x="70" y="100" width="44" height="6" rx="3" fill="white"/>
  <rect x="120" y="100" width="36" height="6" rx="3" fill="white" opacity="0.55"/>
  <rect x="70" y="116" width="60" height="6" rx="3" fill="white" opacity="0.55"/>
  <rect x="70" y="132" width="24" height="6" rx="3" fill="white"/>
  <rect x="100" y="132" width="40" height="6" rx="3" fill="white" opacity="0.55"/>
</svg>
