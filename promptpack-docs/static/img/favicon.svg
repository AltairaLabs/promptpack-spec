<!-- PromptPack favicon — Atlas outline star. Uses starlight-500 for both
     strokes: it holds contrast against light and dark browser chrome alike,
     where each ramp variant fails on one of them. Heavier stroke than the
     navbar mark so it survives being drawn at 16px. -->
<svg xmlns="http://www.w3.org/2000/svg" width="64" height="64" viewBox="0 0 64 64" role="img" aria-label="PromptPack">
  <rect x="4" y="4" width="56" height="56" rx="15" fill="none" stroke="#3B82F6" stroke-width="3"/>
  <polygon points="32,12 36.5,27 51,32 36.5,37 32,52 27.5,37 13,32 27.5,27" fill="none" stroke="#3B82F6" stroke-width="3" stroke-linejoin="round"/>
</svg>
