<svg width="200" height="200" viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg" fill="none">
  <defs>
    <linearGradient id="agentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8B5CF6"/>
      <stop offset="100%" stop-color="#5B21B6"/>
    </linearGradient>
  </defs>

  <!-- Outer container = the pack -->
  <rect x="24" y="40" width="152" height="120" rx="14" fill="white" stroke="#7045AF" stroke-width="2.5"/>

  <!-- Filename tab on top -->
  <rect x="56" y="32" width="88" height="16" rx="4" fill="#7045AF"/>
  <rect x="64" y="38" width="6" height="4" rx="2" fill="white"/>
  <rect x="74" y="38" width="36" height="4" rx="2" fill="white" opacity="0.85"/>
  <rect x="114" y="38" width="22" height="4" rx="2" fill="white" opacity="0.55"/>

  <!-- Workflow state diagram inside -->
  <!-- plan -->
  <circle cx="60" cy="90" r="16" fill="url(#agentGrad)"/>
  <!-- implement (loop node, larger) -->
  <circle cx="100" cy="120" r="18" fill="url(#agentGrad)"/>
  <!-- self-loop on implement showing max_visits -->
  <path d="M 116 110 Q 134 100 128 120 Q 124 134 112 132" stroke="#7045AF" stroke-width="2" fill="none" stroke-linecap="round"/>
  <path d="M 112 132 L 116 134 M 112 132 L 113 128" stroke="#7045AF" stroke-width="2" fill="none" stroke-linecap="round"/>
  <!-- review (terminal) -->
  <circle cx="142" cy="90" r="16" fill="url(#agentGrad)"/>
  <circle cx="142" cy="90" r="20" fill="none" stroke="#7045AF" stroke-width="1.5" opacity="0.5"/>

  <!-- Transitions between nodes -->
  <path d="M 72 100 L 88 114" stroke="#7045AF" stroke-width="2" stroke-linecap="round"/>
  <path d="M 88 114 L 84 108 M 88 114 L 84 116" stroke="#7045AF" stroke-width="2" fill="none" stroke-linecap="round"/>

  <path d="M 114 110 L 130 100" stroke="#7045AF" stroke-width="2" stroke-linecap="round"/>
  <path d="M 130 100 L 124 100 M 130 100 L 128 106" stroke="#7045AF" stroke-width="2" fill="none" stroke-linecap="round"/>
</svg>
